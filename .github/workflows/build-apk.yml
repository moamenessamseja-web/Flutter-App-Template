# Builds the APK through the central reusable workflow.
# Open the run's "Summary" to see the commit, APK size, SHA-256 and signing fingerprint;
# download the APK from the run page -> Artifacts -> android-apk.
name: Build APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    uses: moamenessamseja-web/Flutter-Android-Build/.github/workflows/flutter-android-build.yml@main
    with:
      flutter_version: "3.47.9"      # pinned on purpose; change only deliberately
      build_mode: release
      scaffold_args: "--org com.moamen"   # applicationId = com.moamen.<pubspec name>; cannot change after the first install
    secrets: inherit
